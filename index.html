<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA // ACCESS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="screen">

    <div class="system-label">
      AURA SYSTEM // REGISTRATION ACCESS
    </div>

    <div class="status" id="status">
      STATUS // ACTIVE
    </div>

    <section class="timer-wrapper">

      <p class="small-title">
        ДО ЗАКРЫТИЯ ДОСТУПА
      </p>

      <div class="timer">

        <div class="time-block">
          <span id="hours">00</span>
          <small>HOURS</small>
        </div>

        <span class="separator">:</span>

        <div class="time-block">
          <span id="minutes">00</span>
          <small>MINUTES</small>
        </div>

        <span class="separator">:</span>

        <div class="time-block">
          <span id="seconds">00</span>
          <small>SECONDS</small>
        </div>

      </div>

      <p class="deadline">
        DEADLINE // 05.10.2026 // 23:59 MSK
      </p>

    </section>

    <div class="footer">
      CONNECTION // STABLE
    </div>

  </main>

  <script src="countdown.js"></script>

</body>
</html>
